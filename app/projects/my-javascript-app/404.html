<!doctype html>
<html lang="en">
    <head id="meta-container">
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <script>
            (function () {
                const VERSION = new Date()
                    .toLocaleDateString('en-GB')
                    .split('/')
                    .reverse()
                    .join('.');

                let path = window.location.pathname;
                const originalPath = path;

                // 1. Force Lowercase (Path only)
                if (/[A-Z]/.test(path)) {
                    path = path.toLowerCase();
                }

                // 2. Remove index.html or index.php
                if (path.endsWith('/index.html') || path.endsWith('/index.php')) {
                    path = path.replace(/index\.(html|php)$/, '');
                }

                // 3. Remove .html or .php extensions
                path = path.replace(/\.(html|php)$/, '');

                // 4. Strip trailing slash (e.g., /about/ becomes /about)
                if (path.length > 1 && path.endsWith('/')) {
                    path = path.slice(0, -1);
                }

                // Redirect if path structure was normalized
                if (path !== originalPath) {
                    window.location.replace(path + window.location.search + window.location.hash);
                    return;
                }

                // 5. Custom Error Mapping
                const errorMapping = {
                    '/admin': '/',
                    '/login': '/',
                };

                if (errorMapping[path]) {
                    window.location.replace(errorMapping[path]);
                    return;
                }

                // 6. Path Fallback: Validate dynamic path existence
                if (path !== '/') {
                    fetch(path, { method: 'HEAD' })
                        .then(response => {
                            if (!response.ok) {
                                window.location.replace('/');
                            }
                        })
                        .catch(() => {
                            window.location.replace('/');
                        });
                }

                // 7. Hash Fallback: Validate section ID existence in DOM
                function validateHash() {
                    const hash = window.location.hash;
                    if (hash && hash.length > 1) {
                        const targetId = decodeURIComponent(hash.substring(1));
                        const targetElement = document.getElementById(targetId);

                        // If element with id matching hash doesn't exist, strip hash and fallback to root
                        if (!targetElement) {
                            history.replaceState(null, null, window.location.pathname);
                            window.location.replace('/');
                        }
                    }
                }

                // Run hash check once DOM elements are fully loaded
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', validateHash);
                } else {
                    validateHash();
                }

                // Listen for live hash changes without page reloads
                window.addEventListener('hashchange', validateHash);
            })();
        </script>

        <script defer="">
            const rootUrl = `/`;

            const VERSION = new Date().toLocaleDateString('en-GB').split('/').reverse().join('.');

            const injectAsset = (type, path, media = 'all') => {
                const versionedPath = `${rootUrl}${path}?v=${VERSION}`;
                if (type === 'css') {
                    document.write(
                        `<link rel="stylesheet" href="${versionedPath}" media="${media}">`
                    );
                } else {
                    document.write(`<script type="module" defer src="${versionedPath}"><\/script>`);
                }
            };

            injectAsset('css', 'index.css');
            // injectAsset('css', 'assets/css/animation.css', '(prefers-reduced-motion: none)');
            injectAsset('js', 'index.js');
        </script>
