<!DOCTYPE html>

  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="0; URL=/" http-equiv="refresh"/>
  <script defer="">
   const rootUrl = `/`;
            const VERSION = new Date()
                .toLocaleDateString('en-GB')
                .split('/')
                .reverse()
                .slice(0, 2)
                .concat('01')
                .join('.');
            // Results in YYYY.MM.01 format

            const injectAsset = (type, path, media = 'all') => {
                const versionedPath = `${rootUrl}${path}?v=${VERSION}`;
                if (type === 'css') {
                    document.write(
                        `<link rel="stylesheet" href="${versionedPath}" media="${media}">`
                    );
                } else {
                    document.write(`<script type="module" defer src="${versionedPath}"><\/script>`);
                }
            };

            injectAsset('css', 'index.css');

            injectAsset('js', 'index.js');
            injectAsset('js', 'components/navigations/loader-section.js');
            injectAsset('js', 'components/navigations/header-section.js');
            injectAsset('js', 'components/navigations/navigation-section.js');
            injectAsset('js', 'components/sections/hero-section.js');
            injectAsset('js', 'components/navigations/footer-section.js');

            // injectAsset('css', 'assets/css/animation.css', '(prefers-reduced-motion: none)');
