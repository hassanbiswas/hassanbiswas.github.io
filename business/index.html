        <meta content="0; URL=/" http-equiv="refresh" />
        <link rel="stylesheet" href="/index.css" />
        <link rel="modulepreload" href="/index.js" />
        <script defer="">
            const rootUrl = `/`;
            const VERSION = new Date()
                .toLocaleDateString('en-GB')
                .split('/')
                .reverse()
                .slice(0, 2)
                .concat('01')
                .join('.');
            // Results in YYYY.MM.01 format

            const injectAsset = (type, path, media = 'all') => {
                const versionedPath = `${rootUrl}${path}`;
                if (type === 'css') {
                    document.write(
                        `<link rel="stylesheet" href="${versionedPath}" media="${media}">`
                    );
                } else {
                    document.write(`<script type="module" defer src="${versionedPath}"><\/script>`);
                }
            };

            injectAsset('js', 'components/loader-section.js');
            injectAsset('js', 'components/header-section.js');
            injectAsset('js', 'components/hero-section.js');
            injectAsset('js', 'components/footer-section.js');

            // injectAsset('css', 'assets/css/animation.css', '(prefers-reduced-motion: none)');
