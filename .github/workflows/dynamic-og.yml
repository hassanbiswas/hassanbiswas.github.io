name: Generate Dynamic OG Images

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["compression.yml", "deploy.yml"]
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  release-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Ephemeral Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Set Version Logic
        run: |
          echo "VERSION=$(date +'%y.%m.%d')" >> $GITHUB_ENV
          echo "COMMITTEE_MSG=OG Image Update - Stable Build" >> $GITHUB_ENV

      - name: Generate OG Image via Script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          const outDir = './assets/og-images';
          fs.mkdirSync(outDir, { recursive: true });

          (async () => {
            try {
              const browser = await puppeteer.launch({
                headless: 'new',
                args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
              });

              const page = await browser.newPage();
              await page.setViewport({ width: 1200, height: 630 });

              // Use the actual deployed site, not the local repo file
              const url = 'https://hassanbiswas.github.io';
              await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });

              // Wait until the page actually has content
              await page.waitForFunction(() => {
                const body = document.body;
                return !!body && body.innerText.trim().length > 50;
              }, { timeout: 60000 });

              // If your site has a loader/splash, wait for it to disappear
              await page.waitForFunction(() => {
                const loaders = document.querySelectorAll('.loader, .loading, .splash, [data-loading]');
                for (const el of loaders) {
                  const style = window.getComputedStyle(el);
                  if (style.display !== 'none' && style.visibility !== 'hidden') {
                    return false;
                  }
                }
                return true;
              }, { timeout: 60000 });

              // "Set-and-forget" delay after render
              await page.waitForTimeout(1000);

              const filePath = `${outDir}/og-main.png`;
              await page.screenshot({ path: filePath, fullPage: false });

              console.log('OG image created:', filePath);
              await browser.close();
            } catch (err) {
              console.error('OG generation failed:', err);
              process.exit(1);
            }
          })();
          NODE

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A assets/og-images/og-main.png

          if git diff --staged --quiet; then
            echo "No changes, skipping push."
          else
            git commit -m "$COMMITTEE_MSG [$VERSION]"
            git remote set-url origin https://x-access-token:${{ env.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git pull --rebase --autostash
            git push
          fi
