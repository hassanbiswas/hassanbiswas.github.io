name: Generate Dynamic OG Images

on:
  #push:
    #branches:
      #- main
  workflow_run:
    workflows:
      - compression.yml
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  release-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Ephemeral Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Set Version Logic
        run: |
          echo "VERSION=$(date +'\%y.\%m.\%d')" >> $GITHUB_ENV
          echo "COMMITTEE_MSG=OG Image Update - Stable Build" >> $GITHUB_ENV

      - name: Generate OG Image via Script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          const outDir = './assets/og-images';
          fs.mkdirSync(outDir, { recursive: true });

          (async () => {
            try {
              const browser = await puppeteer.launch({
                headless: 'new',
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                ],
              });

              const page = await browser.newPage();
              await page.setViewport({ width: 1200, height: 630 });

              const url = 'https://hassanbiswas.github.io';
              
              // Wait until network activity settles completely so JS/CSS are loaded
              await page.goto(url, { waitUntil: 'networkidle0', timeout: 60000 });

              // Ensure the body is rendered
              await page.waitForSelector('body', { visible: true, timeout: 30000 });

              // Allow extra time for paint cycles, fonts, and layout execution
              await new Promise((resolve) => setTimeout(resolve, 3000));

              const out = `${outDir}/og-main.png`;
              await page.screenshot({ path: out, fullPage: false, type: 'png' });
              console.log('OG image created:', out);

              const files = fs.readdirSync(outDir);
              console.log('outDir files:', files);

              if (fs.existsSync(out)) {
                console.log('og-main.png size:', fs.statSync(out).size);
              }

              await browser.close();
            } catch (err) {
              console.error('OG generation failed:', err);
              process.exit(1);
            }
          })();
          NODE

      - name: Commit and Push OG Image
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          
          # Set remote URL with the ephemeral token
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git
          
          git fetch origin main
          git pull origin main --rebase --autostash
          
          git add assets/og-images/og-main.png
          git diff --staged --quiet || git commit -m "${{ env.COMMITTEE_MSG }} [${{ env.VERSION }}]"
          git push origin main
          
