name: Generate Dynamic OG Images

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - compression.yml
      - deploy.yml
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  release-automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Ephemeral Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Set Version Logic
        run: |
          echo "VERSION=$(date +'%y.%m.%d')" >> $GITHUB_ENV
          echo "COMMITTEE_MSG=OG Image Update - Stable Build" >> $GITHUB_ENV

      - name: Generate OG Image via Script
        run: |
          node <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          const outDir = './assets/og-images';
          fs.mkdirSync(outDir, { recursive: true });

          (async () => {
            try {
              const browser = await puppeteer.launch({
                headless: 'new',
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-dev-shm-usage',
                ],
              });

              const page = await browser.newPage();
              await page.setViewport({ width: 1200, height: 630 });

              const url = 'https://hassanbiswas.github.io';
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });

              await page.waitForFunction(() => {
                const body = document.body;
                return !!body && body.innerText && body.innerText.trim().length > 50;
              }, { timeout: 60000 });

              await page.waitForFunction(() => {
                const els = document.querySelectorAll('.loader, .loading, .splash, [data-loading]');
                for (const el of els) {
                  const style = window.getComputedStyle(el);
                  if (
                    style.display !== 'none' &&
                    style.visibility !== 'hidden' &&
                    el.offsetParent !== null
                  ) {
                    return false;
                  }
                }
                return true;
              }, { timeout: 60000 });

              await (typeof page.waitForTimeout === 'function'
                ? page.waitForTimeout(1000)
                : new Promise((resolve) => setTimeout(resolve, 1000)));

              const out = `${outDir}/og-main.png`;
              await page.screenshot({ path: out, fullPage: false });
              console.log('OG image created:', out);

              const files = fs.readdirSync(outDir);
              console.log('outDir files:', files);

              if (fs.existsSync(out)) {
                console.log('og-main.png size:', fs.statSync(out).size);
              }

              await browser.close();
            } catch (err) {
              console.error('OG generation failed:', err);
              process.exit(1);
            }
          })();
          NODE
