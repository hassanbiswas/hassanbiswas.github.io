name: Prettier

on:
  schedule:
    # Monthly Schedule: Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prettier-version:
        description: 'Prettier version to use (optional)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  format:
    name: Format repository with Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Prettier and commit changes
        env:
          PRETTIER_VERSION: ${{ github.event.inputs['prettier-version'] }}
        run: |
          set -e
          echo "Using Prettier version: ${PRETTIER_VERSION:-latest}"

          # Format common code & text files across the repo
          npx --yes "prettier@${PRETTIER_VERSION:-latest}" --write "**/*.{js,jsx,ts,tsx,json,css,scss,md,html,yml,yaml,svg,mdx}" || true

          # Stage changes
          git add -A

          # If there are no changes, exit cleanly
          if git diff --cached --quiet; then
            echo "No formatting changes found."
            exit 0
          fi

          # Show changed files for debugging
          CHANGED_FILES=$(git diff --cached --name-only)
          echo "Changed files:\n$CHANGED_FILES"

          # If only workflow files (.github/workflows/*) changed, skip push to avoid needing extra permissions
          ONLY_WORKFLOW=true
          for f in $CHANGED_FILES; do
            if [[ ! "$f" =~ ^.github/workflows/ ]]; then
              ONLY_WORKFLOW=false
              break
            fi
          done

          if [ "$ONLY_WORKFLOW" = true ]; then
            echo "Only workflow files changed; skipping push from workflow run to avoid permissions issues."
            exit 0
          fi

          # Commit and push changes
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -m "chore: format repository with Prettier"

          # Try to push; if push fails (for example due to workflows permission) do not fail the job
          if ! git push; then
            echo "Push failed (possibly due to insufficient permissions to update workflow files)."
            echo "This workflow will exit without failing so it can be made 'set-and-forget'."
            exit 0
          fi
